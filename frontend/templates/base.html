<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Farmer AI{% endblock %}</title>
  <meta name="description" content="{% block description %}AI-powered agriculture tools – crop recommendation and plant disease detection.{% endblock %}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
  {% block head %}{% endblock %}
</head>

<body>

  <!-- Animated background orbs -->
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-farmer sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">🌾 Farmer AI</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link {% block nav_home %}{% endblock %}" href="/">
              <i class="bi bi-house-door me-1"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% block nav_crop %}{% endblock %}" href="/crop-prediction">
              <i class="bi bi-flower1 me-1"></i>Crop Prediction
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% block nav_disease %}{% endblock %}" href="/disease-detection">
              <i class="bi bi-search me-1"></i>Disease Detection
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <div class="page-content">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <footer class="footer-farmer container">
    <p>Farmer AI Project &bull; Crop Recommendation & Disease Detection &bull; Powered by AI & OpenWeatherMap</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
